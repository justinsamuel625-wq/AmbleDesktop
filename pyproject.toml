[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amble-research"
version = "0.1.0"
description = "A research desktop platform for reproducible binocular eye-tracking experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary research prototype"}
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "plotly>=5.24",
  "pyarrow>=17",
  "opencv-contrib-python>=4.14,<5",
  "mediapipe==0.10.35",
  "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-qt>=4.4"]

[project.scripts]
amble = "amble.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amble = ["assets/*.task"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
